<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Message received · I Love Photons</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0a0b17;--ink:#eef1ff;--soft:#b3b8d6;--mute:#7e83a8;--line:rgba(150,160,255,.18);--elec:#00aaff;--violet:#7b2fff;--purple:#b44fff;--green:#39ff14;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Space Grotesk","Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;padding:2rem 1rem;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
.box{width:100%;max-width:36rem;border:1px solid var(--line);background:rgba(27,29,71,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:clamp(2rem,6vw,3.6rem);text-align:center}
.logo{width:180px;margin:0 auto 2rem;display:block}
.tag{font-family:"JetBrains Mono",monospace;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--elec)}
h1{margin:1.2rem 0 1.4rem;font-size:clamp(3rem,2rem + 6vw,5.6rem);font-weight:700;letter-spacing:-.045em;line-height:.88;text-transform:uppercase}
h1 span{display:block}
.g1{background:linear-gradient(90deg,#f0f4ff,var(--elec),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.g2{background:linear-gradient(90deg,var(--violet),var(--purple),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0 0 .8rem;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:300;font-size:1.35rem;color:rgba(238,241,255,.75)}
.mono{font-family:"JetBrains Mono",monospace;font-style:normal;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:1.4rem 0 2.2rem}
a.btn{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:#05050d;background:linear-gradient(90deg,var(--elec),var(--violet));padding:1em 1.6em;box-shadow:0 0 24px rgba(0,170,255,.3)}
a.btn:hover{box-shadow:0 0 34px rgba(123,47,255,.6)}
a:focus-visible{outline:2px solid var(--elec);outline-offset:3px}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<main class="box">
  <img class="logo" src="img/logo.svg" alt="I Love Photons">
  <span class="tag">Message received</span>
  <h1><span class="g1">Thank</span><span class="g2">you.</span></h1>
  <p>We'll be in touch soon.</p>
  <p class="mono">Every system shifts with a single first move.</p>
  <a class="btn" href="./">Back to I Love Photons</a>
</main>
<script>
(function(){var c=document.getElementById('c'),x=c.getContext('2d'),o=document.createElement('canvas'),ox=o.getContext('2d'),W,H,w,h,img,t=0,S=6,r=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){W=innerWidth;H=innerHeight;c.width=W;c.height=H;w=Math.round(W/S);h=Math.round(H/S);o.width=w;o.height=h;img=ox.createImageData(w,h);}
function wv(a,b,sx,sy){var d=Math.sqrt((a-sx)*(a-sx)+(b-sy)*(b-sy));return Math.sin(d/(62/S)*6.2832-t)*Math.max(.2,1-d/(Math.max(w,h)*.8));}
function draw(){var D=img.data,k=0;for(var y=0;y<h;y++)for(var i=0;i<w;i++,k+=4){var p=(wv(i,y,w*.34,h*.5)+wv(i,y,w*.66,h*.5))*.5,P=p*p*.8;D[k]=120*P;D[k+1]=35*P;D[k+2]=255*P;D[k+3]=Math.min(255,P*230);}
ox.putImageData(img,0,0);x.clearRect(0,0,W,H);x.drawImage(o,0,0,W,H);}
function loop(){requestAnimationFrame(loop);t+=.02;draw();}
size();addEventListener('resize',function(){size();if(r)draw();});if(r){t=1.2;draw();}else loop();})();
</script>
</body>
</html>
